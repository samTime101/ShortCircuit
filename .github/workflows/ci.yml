name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom pulls in undici, which needs Node 22.19 or newer for zstd.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test package authoring CLI
        run: npm run test:package-cli

      - name: Build
        run: npm run build

      - name: Check the command line tool
        run: node packages/cli/dist/cli.js help
