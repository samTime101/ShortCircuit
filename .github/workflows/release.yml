name: Release CLI

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/engine/**"
      - "vendor/ShortCircuit-Packages"
      - "vendor/ShortCircuit-Packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "scripts/test-packed-cli.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish @shortcircuitcli/cli
    runs-on: ubuntu-latest
    steps:
      - name: Check the release branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run releases from the main branch." >&2
          exit 1

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read the package version
        id: version
        run: |
          name="$(node -p "require('./packages/cli/package.json').name")"
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release versions must use stable x.y.z semver." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$version as v$version"

      - name: Check whether the version is already published
        id: published
        run: |
          name="${{ steps.version.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already published. The publish steps will be skipped."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is new. The release checks will run."
          fi

      - name: Check the version is not older than the latest release
        run: |
          name="${{ steps.version.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          latest="$(npm view "$name" version)"
          newest="$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)"
          if [ "$newest" != "$version" ]; then
            echo "Version $version is older than the latest published version $latest." >&2
            exit 1
          fi

      - name: Install dependencies
        if: steps.published.outputs.already_published == 'false'
        run: npm ci

      - name: Typecheck
        if: steps.published.outputs.already_published == 'false'
        run: npm run typecheck

      - name: Test
        if: steps.published.outputs.already_published == 'false'
        run: npm test

      - name: Test package authoring
        if: steps.published.outputs.already_published == 'false'
        run: npm run test:package-cli

      - name: Build
        if: steps.published.outputs.already_published == 'false'
        run: npm run build

      - name: Test the packed install
        if: steps.published.outputs.already_published == 'false'
        run: npm run test:cli-packed

      - name: Publish to npm
        if: steps.published.outputs.already_published == 'false'
        run: npm publish --workspace "${{ steps.version.outputs.name }}" --access public

      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="${{ github.sha }}" >/dev/null
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --title "$tag" --notes "Published ${{ steps.version.outputs.name }}@$version to npm."
          fi
